name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
      - name: Read the published index
        run: |
          set -euo pipefail
          # Only code 2 means there is no index branch yet; anything else (network, a 5xx) fails the step.
          code=0
          git ls-remote --exit-code --heads origin index > /dev/null || code=$?
          if [ "$code" -eq 0 ]; then
            git fetch --quiet origin index
            git show FETCH_HEAD:index.json > "$RUNNER_TEMP/published.json"
          elif [ "$code" -ne 2 ]; then
            exit "$code"
          fi
      - name: Changed items go up in version, against the commit before the push and the published index
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # A new branch or a manual run has no commit before: the published index still holds the versions.
          base="${BEFORE:-}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2> /dev/null; then base=HEAD; fi
          published=()
          if [ -f "$RUNNER_TEMP/published.json" ]; then published=(--published "$RUNNER_TEMP/published.json"); fi
          npm run check-versions -- --base "$base" "${published[@]}"
      - name: Build the index
        run: npm run build-index -- --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index
          path: index.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: assinatura
    permissions:
      contents: write
    steps:
      # No npm install and no tests here: this job holds the key, so it runs only git and node:crypto, and it does
      # not trust the index the build job handed it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: index
          path: .
      - name: Check the index against this commit and the published one
        run: |
          set -euo pipefail
          published=()
          # Only code 2 means there is no index branch yet; anything else (network, a 5xx) fails the step.
          code=0
          git ls-remote --exit-code --heads origin index > /dev/null || code=$?
          if [ "$code" -eq 0 ]; then
            git fetch --quiet origin index
            git show FETCH_HEAD:index.json > "$RUNNER_TEMP/published.json"
            published=(--published "$RUNNER_TEMP/published.json")
          elif [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          node scripts/check-index.mjs --commit "$GITHUB_SHA" "${published[@]}"
      - name: Sign the index
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: node scripts/sign-index.mjs
      - name: Verify with the public key of the repository
        run: node scripts/verify-index.mjs
      - name: Prepare the index branch
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/index-branch"
          code=0
          git ls-remote --exit-code --heads origin index > /dev/null || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          if [ "$code" -eq 0 ]; then
            git fetch --quiet origin index
            git worktree add --quiet "$out" FETCH_HEAD
            git -C "$out" switch --quiet -C index
          else
            git worktree add --quiet --detach "$out"
            git -C "$out" switch --quiet --orphan index
          fi
          git -C "$out" rm -r --quiet --force --ignore-unmatch .
          cp index.json index.json.sig "$out/"
          # The hub reads each item next to the index (APP_CATALOG_URL plus the path), so the files of the index go
          # along, with the bytes of this commit that the sha256 of each entry names (checked above).
          node -e 'for (const i of JSON.parse(require("fs").readFileSync("index.json", "utf8")).items) console.log(i.path)' |
            while IFS= read -r path; do
              mkdir -p "$out/$(dirname "$path")"
              cp "$path" "$out/$path"
            done
          git -C "$out" add --all
          git -C "$out" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --allow-empty -m "index of $GITHUB_SHA"
      - name: Push the index branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$RUNNER_TEMP/index-branch" -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --quiet origin index
